<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <h1 style="text-align: center; color: blue;">Đơn ứng tuyển: Front-End Developer</h1>

  <form action="#" method="post" enctype="multipart/form-data">

    <fieldset>
      <legend style="color: blue;">Thông tin cá nhân</legend>

      <label for="fullname">Họ và tên</label><br>
      <input type="text" id="fullname" name="fullname" style="border-radius: 5px;"><br><br>

      <label for="email">Địa chỉ Email</label><br>
      <input type="email" id="email" name="email" style="border-radius: 5px;"><br><br>

      <label for="phone">Số điện thoại</label><br>
      <input type="tel" id="phone" name="phone" style="border-radius: 5px;">
    </fieldset>

    <br>

    <fieldset>
      <legend style="color: blue;">Hồ sơ ứng tuyển</legend>

      <label for="cover-letter">Thư giới thiệu bản thân</label><br>
      <textarea id="cover-letter" name="cover_letter" rows="6" cols="40" style="border-radius: 5px;"></textarea><br><br>

      <label for="resume">Tải lên CV/Resume</label><br>
      <input type="file" id="resume" name="resume">
    </fieldset>

    <br>

    <button type="submit" style="background-color: blue; color: white; font-size: 16px; border-radius: 5px;">Gửi đơn ứng tuyển</button>

  </form>

</body>
</html>
